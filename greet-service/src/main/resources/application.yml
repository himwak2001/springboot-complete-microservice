spring:
  application:
    name: greet-service
  profiles:
    active: "prod"
  datasource:
    url: jdbc:mysql://localhost:3307/greetdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      database-platform: org.hibernate.dialect.MySQL8Dialect
      ddl-auto: update
  config:
    import: optional:configserver:http://localhost:8071

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    shutdown:
      access: unrestricted
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

eureka:
  instance:
    preferIpAddress: true     # want to register this service to eureka using IP Address
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/

info:
  app:
    name: "greet-service"
    description: "Greeting Demo Application"
    version: "1.0.0"

logging:
  level:
    com:
      app: DEBUG